name: Publish Package to npmjs

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing release tag to publish (for example, v1.2.0)'
                required: true
                type: string

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        env:
            RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Verify release tag and version
              run: |
                  node <<'NODE'
                  const { execFileSync } = require('node:child_process');
                  const { version } = require('./package.json');
                  const tag = process.env.RELEASE_TAG;
                  if (tag !== `v${version}`) {
                    throw new Error('Release tag must match the package.json version');
                  }
                  const commit = ref => execFileSync('git', ['rev-parse', '--verify', ref], { encoding: 'utf8' }).trim();
                  if (commit(`refs/tags/${tag}^{commit}`) !== commit('HEAD')) {
                    throw new Error('The checked-out commit must match the release tag');
                  }
                  NODE

            - name: Install dependencies
              run: npm ci

            - name: Check formatting, lint, and tests
              id: verify
              run: npm run format:check && npm run lint && npm test

            - name: Publish to npm
              # Verification already built and tested these artifacts; local publishing keeps prepublishOnly.
              run: npm publish --provenance --access public --ignore-scripts

            - name: Upload bundle assets to release
              if: always() && steps.verify.outcome == 'success'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.RELEASE_TAG }}
                  fail_on_unmatched_files: true
                  files: |
                      dist/umd/arabic-services.umd.js
                      dist/umd/arabic-services.umd.js.map
                      dist/esm/arabic-services.esm.js
                      dist/esm/arabic-services.esm.js.map
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
