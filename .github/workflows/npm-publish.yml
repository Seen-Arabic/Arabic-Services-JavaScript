name: Publish Package to npmjs

# Trigger this workflow when a release is published
on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    build:
        # Specify the runner environment
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            # Step 1: Check out the repository's code
            - name: Check out repository
              uses: actions/checkout@v4

            # Step 2: Set up Node.js environment
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24' # Node 24 includes npm 11+ required for OIDC Trusted Publishing

            # Step 3: Install dependencies using npm ci
            - name: Install dependencies
              run: npm ci

            # Step 4: Build package and bundles
            - name: Build package and bundles
              run: npm run build

            # Step 5: Publish the package to npm using Trusted Publishing (OIDC)
            - name: Publish to npm
              run: npm publish --provenance --access public

            # Step 6: Upload bundle assets to release
            - name: Upload bundle assets to release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/umd/arabic-services.umd.js
                      dist/esm/arabic-services.esm.js
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
